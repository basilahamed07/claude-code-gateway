  # --- OpenAI Direct ---
  # - model_name: openai-gpt4o
  #   litellm_params:
  #     model: openai/gpt-4o
  #     api_key: os.environ/OPENAI_API_KEY

litellm_settings:
  # Drops proprietary Anthropic fields that custom backends might reject
  drop_params: true
  set_verbose: false

general_settings:
  master_key: os.environ/GATEWAY_MASTER_KEY
